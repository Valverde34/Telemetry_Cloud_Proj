# Before the first run:  cp .env.example .env  &&  sh scripts/gen-certs.sh
services:
  mosquitto:
    build: ./mosquitto
    environment:
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD:?set MQTT_API_PASSWORD in .env}
      MQTT_SIMULATOR_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:?set MQTT_SIMULATOR_PASSWORD in .env}
    volumes:
      - ./certs:/mosquitto/certs:ro   # created by scripts/gen-certs.sh
    networks: [messaging]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    # Only the variables the API needs (no env_file: it would also leak the
    # simulator's MQTT password into this container).
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      MQTT_CA_FILE: /certs/ca.crt
      MQTT_USERNAME: api
      MQTT_PASSWORD: ${MQTT_API_PASSWORD:?set MQTT_API_PASSWORD in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro   # only the CA certificate, never the keys
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks: [messaging, backend]
    restart: unless-stopped

  simulator:
    build: ./simulator
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      MQTT_CA_FILE: /certs/ca.crt
      MQTT_USERNAME: simulator
      MQTT_PASSWORD: ${MQTT_SIMULATOR_PASSWORD:?set MQTT_SIMULATOR_PASSWORD in .env}
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    depends_on: [mosquitto]
    networks: [messaging]
    restart: unless-stopped

networks:
  messaging:
  backend:
    internal: true   # DB has no route to the outside world

volumes:
  dbdata:
