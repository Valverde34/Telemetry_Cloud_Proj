# Only an encrypted (TLS) listener: there is no plaintext port 1883.
listener 8883
certfile /mosquitto/data/server.crt
keyfile /mosquitto/data/server.key
tls_version tlsv1.2

# Every client must log in with a username/password...
allow_anonymous false
password_file /mosquitto/data/passwd

# ...and can only touch the topics its ACL allows (least privilege).
acl_file /mosquitto/data/acl

persistence false
log_dest stdout
